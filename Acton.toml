[package]
name = "ton_ai"
description = "Tiny on-chain language model experiment on TON"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.0.0"

[contracts.TinyLm]
display-name = "TinyLM"
src = "contracts/src/TinyLm.tolk"
depends = []

[contracts.ShardedLmCoordinator]
display-name = "ShardedLMCoordinator"
src = "contracts/src/ShardedLmCoordinator.tolk"
depends = []

[contracts.VocabShard]
display-name = "VocabShard"
src = "contracts/src/VocabShard.tolk"
depends = []

[contracts.CraftGptMonoProbe]
display-name = "CraftGPTMonoProbe"
src = "contracts/src/CraftGptMonoProbe.tolk"
depends = []

[contracts.TonGpt]
display-name = "TONGPT"
src = "contracts/src/TonGpt.tolk"
depends = []

[test]

[fmt]
width = 100
ignore = []

[scripts]
deploy-emulation = "acton script contracts/scripts/deploy.tolk"
deploy-testnet = "acton script contracts/scripts/deploy.tolk --net testnet"

[import-mappings]
acton = ".acton"
contracts = "contracts/src"
gen = "gen"
tests = "contracts/tests"
wrappers = "contracts/wrappers"

# Check full Acton.toml reference and all available keys:
# https://ton-blockchain.github.io/acton/docs/acton-toml
